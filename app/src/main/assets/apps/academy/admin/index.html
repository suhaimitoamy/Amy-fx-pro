<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Admin — Amy FX Academy</title>
  <script src="../shared/amyfx-theme-controller.js" data-amyfx-theme-controller="v1"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../shared/amyfx-ui-tokens.css" data-amyfx-ui-tokens="v1">
  <link rel="stylesheet" href="../shared/amyfx-theme.css" data-amyfx-theme="v1">
  <link rel="stylesheet" href="../shared/amyfx-components.css" data-amyfx-components="v1">
  <style>
    body{padding-top:16px}
    .admin-wrap{max-width:960px;margin:0 auto;padding:20px}
    .admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
    .admin-head h1{margin:0;font-size:1.4rem;letter-spacing:.3px}
    .admin-head .badge{color:var(--amy-accent);font-size:.68rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
    .admin-card{background:var(--amy-surface);border:1px solid var(--amy-border);border-radius:16px;padding:18px;margin:14px 0;box-shadow:var(--amy-shadow-soft)}
    .admin-card h2{font-size:1rem;margin:0 0 10px;color:var(--amy-text)}
    .muted{color:var(--amy-text-secondary);font-size:.78rem}
    textarea,input,select{width:100%;box-sizing:border-box;border:1px solid var(--amy-border);border-radius:12px;padding:12px;margin:8px 0;background:rgba(0,0,0,.25);color:var(--amy-text);font:inherit}
    textarea:focus,input:focus{outline:none;border-color:var(--amy-accent)}
    button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--amy-accent);color:#0a0a0a;margin:4px;cursor:pointer}
    button.ghost{background:transparent;color:var(--amy-accent);border:1px solid var(--amy-border)}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .link-cta{display:inline-flex;align-items:center;gap:8px;margin-top:4px;color:var(--amy-accent);font-weight:700;text-decoration:none}
  </style>
</head>
<body class="amyfx-module amyfx-module--academy">
  <main class="admin-wrap">
    <div class="admin-head">
      <div>
        <div class="badge">Amy FX · Content Admin</div>
        <h1>Admin Academy</h1>
      </div>
      <a class="link-cta" href="editor.html">Buka Editor ›</a>
    </div>
    <section class="admin-card">
      <h2>Catatan Admin</h2>
      <textarea id="adminNotes" rows="8" placeholder="Tulis catatan materi, revisi, atau ide update academy..."></textarea>
      <div class="row"><button id="saveNotes">Simpan</button><button class="ghost" id="clearNotes">Hapus</button></div>
    </section>
    <section class="admin-card">
      <h2>Backup Data Academy</h2>
      <p class="muted">Export/import localStorage Academy.</p>
      <div class="row"><button id="exportData">Export</button><button class="ghost" id="importBtn">Import</button><input id="importFile" type="file" accept="application/json" hidden></div>
    </section>
    <section class="admin-card">
      <h2>Status</h2>
      <div id="statusBox" class="muted">Siap.</div>
    </section>
  </main>
  <script src="../assets/js/auth.js"></script>
  <script>
    if (typeof requireLogin === 'function') requireLogin();
    const notes=document.getElementById('adminNotes'), statusBox=document.getElementById('statusBox');
    notes.value=localStorage.getItem('amy_academy_admin_notes')||'';
    document.getElementById('saveNotes').onclick=()=>{localStorage.setItem('amy_academy_admin_notes',notes.value);statusBox.textContent='Catatan tersimpan.'};
    document.getElementById('clearNotes').onclick=()=>{notes.value='';localStorage.removeItem('amy_academy_admin_notes');statusBox.textContent='Catatan dihapus.'};
    document.getElementById('exportData').onclick=()=>{const data={exportedAt:new Date().toISOString(),storage:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('amy_'))data.storage[k]=localStorage.getItem(k)}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='amy-academy-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
    document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
    document.getElementById('importFile').onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      try{
        const data=JSON.parse(await f.text());
        if(!data.storage || typeof data.storage !== 'object') throw new Error('Format salah');
        let count=0;
        Object.entries(data.storage).forEach(([k,v])=>{
          if(k.startsWith('amy_') && k!=='amy_academy_access_hash' && k!=='amy_academy_session' && typeof v==='string' && v.length<50000){
            localStorage.setItem(k,v); count++;
          }
        });
        statusBox.textContent=`Import selesai. ${count} item dipulihkan.`;
      }catch(err){statusBox.textContent='Import gagal: '+err.message;}
    };
  </script>
</body>
</html>
