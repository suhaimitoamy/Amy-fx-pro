<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070b12">
  <title>Latihan Soal 60 Kasus — Amy FX Backtest Lab</title>
  <script src="../../shared/amyfx-theme-controller.js" data-amyfx-theme-controller="v1"></script>
  <link rel="stylesheet" href="assets/css/practice.css">
</head>
<body class="amyfx-module amyfx-module--backtest">
  <header class="bt-header">
    <div class="bt-header-inner">
      <a class="bt-brand" href="index.html">
        <span class="bt-brand-mark">A</span>
        <span>Amy FX</span>
        <span class="bt-brand-sub">Backtest</span>
      </a>

      <nav class="bt-nav" id="navlinks" aria-label="Navigasi Backtest Lab">
        <a href="../../../index.html">Beranda</a>
        <a href="candle-replay.html">Replay</a>
        <a href="backtest-history.html">Performa</a>
        <a href="guided-practice.html" class="is-active">Latihan</a>
        <a href="../index.html">Tutorial</a>
      </nav>

      <div class="bt-header-actions">
        <button type="button" id="themeToggleBtn" class="bt-btn-sm">Terang</button>
        <button type="button" id="hamburger" class="bt-hamburger" aria-label="Buka menu" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <main class="bt-container">
    <div class="bt-page-head">
      <h1>Latihan 60 Kasus</h1>
      <div class="bt-toolbar-group bt-filter-bar">
        <select id="exerciseCategory" class="bt-select" aria-label="Tingkat kesulitan">
          <option value="ALL">Semua · 60</option>
          <option value="mudah">Mudah · 20</option>
          <option value="sedang">Sedang · 20</option>
          <option value="advanced">Advanced · 20</option>
        </select>
        <select id="sessionLength" class="bt-select" aria-label="Panjang sesi">
          <option value="10">10 soal</option>
          <option value="20">20 soal</option>
          <option value="60">60 soal</option>
        </select>
        <button id="startSession" type="button" class="bt-btn bt-btn-primary" disabled>Mulai</button>
        <button id="lastSummary" type="button" class="bt-btn" hidden>Rangkuman</button>
      </div>
    </div>

    <div class="bt-guided-grid" id="guidedWorkspace">
      <section class="bt-chart-stage">
        <div class="bt-ohlc-bar">
          <div class="bt-ohlc-vals">
            <span id="ohlcTime">—</span>
            <span><b>O</b><span id="ohlcOpen">—</span></span>
            <span><b>H</b><span id="ohlcHigh">—</span></span>
            <span><b>L</b><span id="ohlcLow">—</span></span>
            <span><b>C</b><span id="ohlcClose">—</span></span>
          </div>
          <span class="bt-tag bt-tag-be" id="exerciseTimeframe">—</span>
        </div>
        <div id="chart" class="practice-chart-shell"></div>
        <p id="chartGuide" class="bt-chart-guide"></p>
      </section>

      <aside class="bt-side-stack">
        <section class="bt-card">
          <div class="bt-card-head bt-card-head-tight">
            <span class="bt-card-title" id="exerciseLabel">SOAL 1</span>
          </div>
          <div class="bt-progress-track">
            <div class="bt-progress-fill" id="guidedProgress"></div>
          </div>
          <h2 id="exerciseTitle" class="bt-exercise-title">Memuat studi kasus…</h2>
          <p id="exercisePrompt" class="bt-exercise-prompt"></p>

          <div id="exerciseChoices" class="bt-choices"></div>
          <p id="guidedStatus" class="bt-status-line" role="status" aria-live="polite">Pilih jawaban terbaik.</p>

          <div class="bt-toolbar-group bt-exercise-actions">
            <button id="nextExercise" type="button" class="bt-btn bt-btn-primary" hidden>Lanjut</button>
            <button id="endSession" type="button" class="bt-btn">Selesai</button>
          </div>
          <p id="saveNotice" class="bt-status-line" role="status"></p>
        </section>

        <section class="bt-card">
          <h3 class="bt-card-title bt-card-title-mb">Prinsip &amp; Materi</h3>
          <div class="bt-principle-box" id="exercisePrinciple">Jawab untuk membuka penjelasan &amp; materi terkait.</div>
          <a id="exerciseLesson" class="bt-btn bt-btn-primary" href="../index.html" hidden>Materi →</a>
        </section>
      </aside>
    </div>

    <section id="guidedSummary" class="bt-card bt-section" hidden>
      <div class="bt-card-head">
        <div>
          <h2 class="bt-summary-title">Rangkuman Sesi</h2>
          <p id="summaryScore" class="bt-summary-score tabular"></p>
        </div>
        <div class="bt-toolbar-group">
          <button id="restartSession" type="button" class="bt-btn bt-btn-primary">Ulangi Acak</button>
          <a class="bt-btn" href="../index.html">Tutorial →</a>
        </div>
      </div>
      <p id="summaryIntro" class="bt-meta-hint"></p>
      <div id="reviewTopics" class="bt-side-stack"></div>
    </section>
  </main>

  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="assets/js/practice-core.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/drawing-core.js"></script>
  <script src="assets/js/chart-engine.js"></script>
  <script src="assets/js/practice-ui.js"></script>
  <script src="assets/js/guided-session.js"></script>
  <script src="assets/js/guided-practice.js"></script>
</body>
</html>
