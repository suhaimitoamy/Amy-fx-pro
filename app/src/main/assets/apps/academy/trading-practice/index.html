<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070b12">
  <title>Backtest Lab — Amy FX</title>
  <script src="../../shared/amyfx-theme-controller.js" data-amyfx-theme-controller="v1"></script>
  <link rel="stylesheet" href="assets/css/practice.css">
</head>
<body class="amyfx-module amyfx-module--backtest">
  <header class="bt-header">
    <div class="bt-header-inner">
      <div class="bt-header-left">
        <button type="button" id="btBackBtn" class="bt-back-btn" data-back-fallback="../../../index.html#backtest" aria-label="Kembali ke menu Backtest" title="Kembali">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <a class="bt-brand" href="index.html">
          <span class="bt-brand-mark">A</span>
          <span>Amy FX</span>
          <span class="bt-brand-sub">Backtest</span>
        </a>
      </div>

      <nav class="bt-nav" id="navlinks" aria-label="Navigasi Backtest Lab">
        <a href="../../../index.html#beranda">Beranda</a>
        <a href="candle-replay.html">Replay</a>
        <a href="backtest-history.html">Performa</a>
        <a href="guided-practice.html">Latihan</a>
        <a href="../index.html">Tutorial</a>
      </nav>

      <div class="bt-header-actions">
        <button type="button" id="themeToggleBtn" class="bt-btn-sm">Terang</button>
        <button type="button" id="hamburger" class="bt-hamburger" aria-label="Buka menu" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <main class="bt-container">
    <div class="bt-page-head">
      <h1>Backtest Lab</h1>
      <div class="bt-toolbar-group">
        <a href="candle-replay.html" class="bt-btn bt-btn-primary">Buka Replay →</a>
      </div>
    </div>

    <section class="bt-account-bar" aria-label="Ringkasan Backtest Lokal">
      <div class="bt-account-metrics">
        <div class="bt-metric">
          <span class="bt-metric-label">Sesi</span>
          <span class="bt-metric-value is-gold" id="hubSessionName">Sesi Utama</span>
        </div>
        <div class="bt-metric">
          <span class="bt-metric-label">Saldo</span>
          <span class="bt-metric-value" id="hubBalance">—</span>
        </div>
        <div class="bt-metric">
          <span class="bt-metric-label">Trade</span>
          <span class="bt-metric-value" id="hubTradeCount">0</span>
        </div>
        <div class="bt-metric">
          <span class="bt-metric-label">Data</span>
          <span class="bt-metric-value" id="hubPackCount">Sample · Jan 2025</span>
        </div>
      </div>
    </section>

    <section class="bt-hub-grid">
      <a class="bt-hub-card is-featured" href="candle-replay.html">
        <div>
          <h2>Replay Lab <button type="button" class="amy-info-btn" data-info-tip="Simulasi bar-by-bar M1–D1 Cloud 2019–2026 tanpa melihat candle masa depan." aria-label="Info Replay Lab" aria-expanded="false">i</button></h2>
        </div>
        <div class="bt-hub-meta">
          <span>Zero Future Leak</span>
          <span>Buka →</span>
        </div>
      </a>

      <a class="bt-hub-card" href="backtest-history.html">
        <div>
          <h2>Performa <button type="button" class="amy-info-btn" data-info-tip="Kurva ekuitas, analisis setup ICT, dan ekspor trade ke Jurnal Simulasi." aria-label="Info Performa Backtest" aria-expanded="false">i</button></h2>
        </div>
        <div class="bt-hub-meta">
          <span>Analitik &amp; CSV</span>
          <span>Buka →</span>
        </div>
      </a>

      <a class="bt-hub-card" href="guided-practice.html">
        <div>
          <h2>Latihan 100 Kasus <button type="button" class="amy-info-btn" data-info-tip="100 studi kasus chart XAU/USD lintas 8 pilar ICT dengan 4 pilihan menantang & kelanjutan candle (After)." aria-label="Info Latihan 100 Kasus" aria-expanded="false">i</button></h2>
        </div>
        <div class="bt-hub-meta">
          <span>100 Soal · 8 Pilar</span>
          <span>Buka →</span>
        </div>
      </a>
    </section>
  </main>

  <script src="assets/js/practice-core.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/practice-analytics.js"></script>
  <script src="assets/js/practice-ui.js"></script>
  <script>
    (async function () {
      try {
        var storage = window.AmyPracticeStorage;
        var analytics = window.AmyPracticeAnalytics;
        var ui = window.AmyPracticeUI;
        var prof = storage.readProfileAccountParams();
        var sess = storage.getActiveSession();
        var trades = await storage.listTrades(sess.id);
        var packs = await storage.listHistoricalPacks();
        var stats = analytics.computeStats(trades, {
          initialBalanceUsd: sess.initialBalanceUsd,
          defaultRiskUsd: sess.initialBalanceUsd * (sess.riskPercent / 100)
        });
        ui.text('hubSessionName', sess.name);
        ui.text('hubBalance', storage.formatMoney(stats.currentBalanceUsd, prof.currency, prof.usdIdrRate));
        ui.text('hubTradeCount', String(trades.length) + ' (' + stats.wins + 'W/' + stats.losses + 'L)');
        ui.text('hubPackCount', packs.length ? (packs.length + ' pack Cloud/lokal') : 'Sample · Jan 2025');
      } catch (_) {}
    })();
  </script>
</body>
</html>
