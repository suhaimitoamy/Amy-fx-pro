name: Validate Amy FX 1.5.8 Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/amyfx-stage5-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: amyfx-stage5-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AMYFX_KEYSTORE_PATH: /tmp/amy-fx-signing.keystore
  AMYFX_KEYSTORE_PASSWORD: android
  AMYFX_KEY_ALIAS: androiddebugkey
  AMYFX_KEY_PASSWORD: android
  AMYFX_VERSION_NAME: "1.5.8"
  AMYFX_VERSION_CODE: "49"
  AMYFX_SIGNING_CERT_SHA256: "47:C2:32:BC:44:FA:63:C9:2F:FE:41:1F:71:40:40:4C:09:AA:2A:9C:BF:82:B1:85:9A:86:0B:85:56:7B:AD:C7"

jobs:
  validate-release:
    # This is the archived 1.5.8/com.amyelitesuite line, not the current Pro release line.
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/amyfx-stage5-release'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore permanent Amy FX signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: amy-fx-debug-keystore-v1

      - name: Verify update-compatible signing certificate
        run: |
          set -euo pipefail
          if [ "${{ steps.signing-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Permanent Amy FX signing key tidak ditemukan."
            exit 1
          fi
          cp "$HOME/.android/debug.keystore" "$AMYFX_KEYSTORE_PATH"
          actual="$(keytool -list -v -keystore "$AMYFX_KEYSTORE_PATH" -storepass "$AMYFX_KEYSTORE_PASSWORD" -alias "$AMYFX_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          test "$actual" = "$AMYFX_SIGNING_CERT_SHA256"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run JavaScript regression tests
        run: timeout 10m npm test

      - name: Verify repository integrity
        run: |
          set -euo pipefail
          rm -f local.properties
          git diff --check
          test -z "$(git status --porcelain | grep -E '(^|/)(.*\.jks|.*\.keystore)$' || true)"

      - name: Run Android release unit tests
        run: ./gradlew testReleaseUnitTest --no-configuration-cache

      - name: Run Android release lint
        run: ./gradlew lintRelease --no-configuration-cache

      - name: Build signed Amy FX 1.5.8 APK
        run: ./gradlew assembleRelease --no-configuration-cache --stacktrace

      - name: Upload built APK for signing inspection
        uses: actions/upload-artifact@v4
        with:
          name: Amy-FX-v1.5.8-stage5-built-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Verify APK identity, version, signing structures and signer
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.amyelitesuite' versionCode='${AMYFX_VERSION_CODE}' versionName='${AMYFX_VERSION_NAME}'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"

          sf_entry="$(unzip -Z1 "$apk" | grep -E '^META-INF/[^/]+\.SF$' | head -n1)"
          cert_entry="$(unzip -Z1 "$apk" | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$' | head -n1)"
          test -n "$sf_entry"
          test -n "$cert_entry"
          unzip -p "$apk" "$cert_entry" > /tmp/amyfx-apk-cert
          expected="$(echo "$AMYFX_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$(keytool -printcert -file /tmp/amyfx-apk-cert | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "APK v1 entries: $sf_entry, $cert_entry"
          echo "APK signer SHA-256: ${actual:-missing}"
          test -n "$actual"
          test "$actual" = "$expected"

          APK_PATH="$apk" python3 - <<'PY'
          import os
          import struct

          path = os.environ["APK_PATH"]
          data = open(path, "rb").read()
          magic = b"APK Sig Block 42"
          index = data.rfind(magic)
          if index < 0:
              raise SystemExit("APK Signing Block tidak ditemukan")
          size = struct.unpack_from("<Q", data, index - 8)[0]
          start = index + 8 - size
          if start < 0 or struct.unpack_from("<Q", data, start)[0] != size:
              raise SystemExit("APK Signing Block tidak valid")
          position = start + 8
          end = index - 8
          ids = set()
          while position < end:
              length = struct.unpack_from("<Q", data, position)[0]
              position += 8
              if length < 4 or position + length > end:
                  raise SystemExit("Pasangan APK Signing Block rusak")
              ids.add(struct.unpack_from("<I", data, position)[0])
              position += length
          if 0x7109871A not in ids:
              raise SystemExit("APK Signature Scheme v2 tidak ditemukan")
          print("APK Signature Scheme v2 ditemukan")
          PY

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: Amy-FX-v1.5.8-stage5-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
