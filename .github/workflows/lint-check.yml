name: Lint / Static Check

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "app/**"
      - "lib/**"
      - "api/**"
      - "tests/**"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "app/**"
      - "lib/**"
      - "api/**"
      - "tests/**"

concurrency:
  group: lint-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # One explicitly requested no-test release; other commits retain lint.
    if: ${{ !contains(github.event.head_commit.message, '[release329-no-tests]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lintDebug --no-configuration-cache --stacktrace

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Amy-FX-lint-report
          path: app/build/reports/lint-results-debug.*
