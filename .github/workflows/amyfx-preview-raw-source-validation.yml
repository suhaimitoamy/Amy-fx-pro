name: Amy FX Preview Raw Source Validation

on:
  pull_request:
    branches:
      - personal/amyfx-private
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amyfx-preview-raw-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-raw-preview-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AMYFX_APPLICATION_ID: com.amyelitesuite.learningpreview
      AMYFX_APP_LABEL: Amy FX Preview
      AMYFX_URI_SCHEME: amyfxpreview
      AMYFX_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/suhaimitoamy/Amy-fx-pro/personal/amyfx-private/preview-update.json
      AMYFX_VERSION_CODE: 939998
      AMYFX_VERSION_NAME: 2.0.0-preview.raw-validation
      AMYFX_TEST_FILE_TIMEOUT_MS: 60000

    steps:
      - name: Checkout raw Preview source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify private Preview target
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.base_ref }}" = "personal/amyfx-private"
          test "${{ github.base_ref }}" != "main"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate raw JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/apps/mapping/js/api/closed-candle-response-sanitizer.js
          node --check app/src/main/assets/apps/mapping/js/engine/mapping-refresh-dependencies.js
          node --check app/src/main/assets/apps/mapping/js/candle-refresh-coordinator.js
          node --check app/src/main/assets/apps/mapping/js/mapping-runtime-repair-v3.js
          node --check app/src/main/assets/apps/mapping/js/live-price-display-only-v1.js
          node --check app/src/main/assets/apps/mapping/js/main.js
          node --check app/src/main/assets/apps/mapping/js/analysis-ui-stability-v4.js
          node --check app/src/main/assets/apps/mapping/js/bridge/sync-fix.js
          node --check app/src/main/assets/apps/mapping/js/bridge/notify-guard.js
          node --check app/src/main/assets/app-version.js
          node --check app/src/main/assets/update-checker.js

      - name: Run raw source regression without forced exit
        run: npm test

      - name: Confirm tests did not rewrite raw source
        run: git diff --exit-code

      - name: Verify stabilization produces no hidden source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-blueprint-preview.py
          git diff --exit-code

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate raw Android source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Confirm Android validation left source clean
        run: git diff --exit-code
