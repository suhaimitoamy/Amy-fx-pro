name: Amy FX Pro Build and Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/assets/app-version.js'
      - 'app/src/main/assets/update-checker.js'
      - 'app/src/main/assets/apps/academy/**'
      - 'app/src/main/assets/apps/mapping/**'
      - 'supabase/functions/scalper-engine/**'
      - 'supabase/functions/smt-dxy-candles/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amyfx-pro-release-${{ github.ref }}
  cancel-in-progress: true

env:
  AMYFX_APPLICATION_ID: com.amyelitesuite.learningpreview
  AMYFX_APP_LABEL: Amy FX Pro
  AMYFX_URI_SCHEME: amyfxpreview
  AMYFX_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/suhaimitoamy/Amy-fx-pro/main/update.json
  AMYFX_KEYSTORE_PATH: /tmp/amyfx-pro-signing.keystore
  AMYFX_KEYSTORE_PASSWORD: android
  AMYFX_KEY_PASSWORD: android
  TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Amy FX Pro
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve source version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(node -p "require('fs').readFileSync('app/src/main/assets/app-version.js','utf8').match(/name:\\s*'([^']+)'/)[1]")"
          version_code="$(node -p "require('fs').readFileSync('app/src/main/assets/app-version.js','utf8').match(/code:\\s*(\\d+)/)[1]")"
          test -n "$version_name" && test -n "$version_code"
          echo "AMYFX_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "AMYFX_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "AMYFX_RELEASE_TAG=amyfx-pro-$version_name" >> "$GITHUB_ENV"
          echo "Resolved source version: $version_name ($version_code)"

      - name: Validate source identity and JavaScript
        if: env.AMYFX_VERSION_CODE != '950329'
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app-version.js
          node --check app/src/main/assets/update-checker.js
          find app/src/main/assets/apps/academy/trading-practice/assets/js -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app/src/main/assets/apps/mapping/js/scalper-stats-page.js
          node --check app/src/main/assets/apps/mapping/js/engine/sweep-acceptance.js
          node --check app/src/main/assets/apps/mapping/js/engine/smt-selector.js
          node --check app/src/main/assets/apps/mapping/js/engine/mapping-context-aggregator.js
          node --check app/src/main/assets/apps/mapping/js/mapping-context-orchestrator-v1.js
          node --check supabase/functions/scalper-engine/expansion-range-reentry.mjs
          node --check supabase/functions/scalper-engine/expansion-range-lifecycle.mjs
          node --check supabase/functions/scalper-engine/smr-first-retest.mjs
          python3 -m json.tool update.json >/dev/null
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app/src/main/assets/app-version.js', 'utf8');
          const gradle = fs.readFileSync('app/build.gradle.kts', 'utf8');
          const name = process.env.AMYFX_VERSION_NAME;
          const code = Number(process.env.AMYFX_VERSION_CODE);
          if (!app.includes(`name: '${name}', code: ${code}`)) throw new Error('app-version.js identity mismatch');
          if (!gradle.includes(`?: ${code})`) || !gradle.includes(`?: "${name}"`)) throw new Error('Gradle source identity mismatch');
          if (!gradle.includes('com.amyelitesuite.learningpreview') || !gradle.includes('Amy FX Pro') || !gradle.includes('Amy-fx-pro/main/update.json')) throw new Error('Pro continuity identity mismatch');
          const manifest = JSON.parse(fs.readFileSync('update.json', 'utf8'));
          const publishedCode = Number(manifest.latest_version_code ?? manifest.versionCode ?? 0);
          const publishedName = String(manifest.latest_version_name ?? manifest.version ?? '');
          if (!Number.isFinite(publishedCode) || publishedCode <= 0 || !publishedName) throw new Error('Invalid published update identity');
          if (publishedCode > code) throw new Error('Published update is newer than source');
          const expected = `amyfx-pro-${publishedName}/AmyFX-Pro-latest.apk`;
          if (!String(manifest.apk_url || manifest.downloadUrl || '').includes(expected)) throw new Error('Published APK URL/version mismatch');
          NODE

      - name: Run JavaScript regression suite
        if: env.AMYFX_VERSION_CODE != '950329'
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Try Preview signing-key continuity
        id: preview-key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: amy-fx-debug-keystore-v1

      - name: Restore Amy FX Pro signing key
        id: pro-key
        if: steps.preview-key.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/amyfx-pro.keystore
          key: amy-fx-pro-signing-key-v1

      - name: Prepare persistent signing identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ "${{ steps.preview-key.outputs.cache-hit }}" = "true" ]; then
            cp "$HOME/.android/debug.keystore" "$AMYFX_KEYSTORE_PATH"
            echo 'AMYFX_KEY_ALIAS=androiddebugkey' >> "$GITHUB_ENV"
            echo 'mode=preview-continuity' >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.pro-key.outputs.cache-hit }}" != "true" ]; then
              echo 'Permanent signing key missing; refusing to replace the installed app signer.'
              exit 1
            fi
            cp "$HOME/.android/amyfx-pro.keystore" "$AMYFX_KEYSTORE_PATH"
            echo 'AMYFX_KEY_ALIAS=amyfxpro' >> "$GITHUB_ENV"
            echo 'mode=pro-signer' >> "$GITHUB_OUTPUT"
          fi

      - name: Save new Amy FX Pro signing key
        if: steps.signing.outputs.generated == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/amyfx-pro.keystore
          key: amy-fx-pro-signing-key-v1

      - name: Verify signing identity
        if: env.AMYFX_VERSION_CODE != '950329'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(keytool -list -v -keystore "$AMYFX_KEYSTORE_PATH" -storepass "$AMYFX_KEYSTORE_PASSWORD" -alias "$AMYFX_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          test -n "$actual"
          echo "AMYFX_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"
          if [ "${{ steps.signing.outputs.mode }}" = 'preview-continuity' ]; then
            test "$actual" = '47:C2:32:BC:44:FA:63:C9:2F:FE:41:1F:71:40:40:4C:09:AA:2A:9C:BF:82:B1:85:9A:86:0B:85:56:7B:AD:C7'
          fi

      - name: Build signed APK (329 skips tests by request)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ "$AMYFX_VERSION_CODE" != "950329" ]; then
            ./gradlew testReleaseUnitTest lintRelease --no-configuration-cache
          fi
          ./gradlew assembleRelease --no-configuration-cache --stacktrace

      - name: Verify APK identity and signer
        if: env.AMYFX_VERSION_CODE != '950329'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$apk" && test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$aapt" dump badging "$apk" | tee /tmp/amyfx-pro-badging.txt
          grep -Fq "package: name='${AMYFX_APPLICATION_ID}' versionCode='${AMYFX_VERSION_CODE}' versionName='${AMYFX_VERSION_NAME}'" /tmp/amyfx-pro-badging.txt
          grep -Fq "application-label:'${AMYFX_APP_LABEL}'" /tmp/amyfx-pro-badging.txt
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/amyfx-pro-signing.txt
          expected="$(echo "$AMYFX_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/amyfx-pro-signing.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          cp "$apk" AmyFX-Pro-latest.apk
          sha256sum AmyFX-Pro-latest.apk | tee AmyFX-Pro-latest.apk.sha256

      - name: Package Pro329 APK without additional verification
        if: env.AMYFX_VERSION_CODE == '950329'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          cp "$apk" AmyFX-Pro-latest.apk
          sha256sum AmyFX-Pro-latest.apk > AmyFX-Pro-latest.apk.sha256
          echo 'AMYFX_SIGNING_CERT_SHA256=not-rechecked-for-329' >> "$GITHUB_ENV"

      - name: Publish Amy FX Pro release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<NOTES
          Amy FX Pro $AMYFX_VERSION_NAME

          - Candle Replay: gambar berulang, tap untuk memilih, resize bebas, duplikat dan daftar objek.
          - Fullscreen dengan fallback Android WebView; data candle replay tetap terlindungi.
          - Pemulihan terjemahan berita Indonesia dan percobaan ulang terjemahan yang gagal.
          - Rilis 329 tanpa test/backtest/verifikasi tambahan sesuai permintaan.
          - Signing mode: ${{ steps.signing.outputs.mode }}.
          - Signing certificate SHA-256: $AMYFX_SIGNING_CERT_SHA256.
          NOTES
          if gh release view "$AMYFX_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$AMYFX_RELEASE_TAG" AmyFX-Pro-latest.apk AmyFX-Pro-latest.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$AMYFX_RELEASE_TAG" AmyFX-Pro-latest.apk AmyFX-Pro-latest.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Amy FX Pro $AMYFX_VERSION_NAME" --notes-file /tmp/release-notes.md --latest
          fi
          gh release view "$AMYFX_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'AmyFX-Pro-latest.apk'

      - name: Verify published APK endpoint
        if: env.AMYFX_VERSION_CODE != '950329'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${AMYFX_RELEASE_TAG}/AmyFX-Pro-latest.apk"
          curl -fL --retry 4 --retry-delay 3 -o /tmp/AmyFX-Pro-published.apk "$url"
          test -s /tmp/AmyFX-Pro-published.apk
          test "$(sha256sum /tmp/AmyFX-Pro-published.apk | awk '{print $1}')" = "$(sha256sum AmyFX-Pro-latest.apk | awk '{print $1}')"

      - name: Upload signed Pro artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amy-FX-Pro-${{ env.AMYFX_VERSION_NAME }}-signed
          path: |
            AmyFX-Pro-latest.apk
            AmyFX-Pro-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Activate published Pro update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          python3 - <<'PYUPDATE'
          import os, json, pathlib, re, datetime, hashlib
          source=pathlib.Path('app/src/main/assets/app-version.js').read_text()
          name=os.environ['AMYFX_VERSION_NAME']; code=int(os.environ['AMYFX_VERSION_CODE'])
          if "name: '"+name+"', code: "+str(code) not in source:
              raise SystemExit('Source advanced during build. Do not activate an older release.')
          path=pathlib.Path('update.json'); data=json.loads(path.read_text())
          if int(data.get('latest_version_code',0))>code:
              raise SystemExit('Refusing update manifest downgrade')
          url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+os.environ['AMYFX_RELEASE_TAG']+'/AmyFX-Pro-latest.apk'
          notes=['Candle Replay: gambar berulang, pemilihan objek dan resize bebas.','Fullscreen, daftar objek dan duplikat gambar.','Perbaikan terjemahan berita Bahasa Indonesia.']
          data.update(latest_version_code=code,latest_version_name=name,versionCode=code,version=name,apk_url=url,downloadUrl=url,enabled=True,releaseDate=datetime.date.today().isoformat(),release_notes=notes,changelog=notes,sha256=hashlib.sha256(pathlib.Path('AmyFX-Pro-latest.apk').read_bytes()).hexdigest())
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PYUPDATE
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m "Activate published Amy FX Pro $AMYFX_VERSION_NAME"
            git push origin HEAD:main
          fi
