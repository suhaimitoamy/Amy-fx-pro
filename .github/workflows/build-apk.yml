name: Amy FX Pro Validate and Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amyfx-pro-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  AMYFX_APPLICATION_ID: com.amyelitesuite.learningpreview
  AMYFX_APP_LABEL: Amy FX Pro
  AMYFX_URI_SCHEME: amyfxpreview
  AMYFX_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/suhaimitoamy/Amy-fx-pro/main/update.json
  AMYFX_VERSION_NAME: "2.0.0-pro.316"
  AMYFX_VERSION_CODE: "950316"
  TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Amy FX Pro
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Pro identity and Preview baseline
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app-version.js
          node --check app/src/main/assets/update-checker.js
          grep -Fq "name: '2.0.0-pro.316', code: 950316" app/src/main/assets/app-version.js
          grep -Fq 'com.amyelitesuite.learningpreview' app/build.gradle.kts
          grep -Fq 'Amy FX Pro' app/build.gradle.kts
          grep -Fq 'Amy-fx-pro/main/update.json' app/build.gradle.kts
          grep -Fq 'Amy FX Pro' app/src/main/assets/index.html
          python3 -m json.tool update.json >/dev/null
          grep -Fq '"latest_version_code": 950316' update.json
          grep -Fq '"latest_version_name": "2.0.0-pro.316"' update.json

      - name: Run JavaScript regression suite
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew testReleaseUnitTest --no-configuration-cache

      - name: Run Android lint
        run: ./gradlew lintRelease --no-configuration-cache

      - name: Build release APK
        run: ./gradlew assembleRelease --no-configuration-cache --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" | tee /tmp/amyfx-pro-badging.txt
          grep -Fq "package: name='${AMYFX_APPLICATION_ID}' versionCode='${AMYFX_VERSION_CODE}' versionName='${AMYFX_VERSION_NAME}'" /tmp/amyfx-pro-badging.txt
          grep -Fq "application-label:'${AMYFX_APP_LABEL}'" /tmp/amyfx-pro-badging.txt
          mkdir -p dist
          cp "$apk" dist/AmyFX-Pro-${AMYFX_VERSION_NAME}.apk

      - name: Upload validation APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amy-FX-Pro-${{ env.AMYFX_VERSION_NAME }}-validation-apk
          path: dist/AmyFX-Pro-${{ env.AMYFX_VERSION_NAME }}.apk
          if-no-files-found: error
