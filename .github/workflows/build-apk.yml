name: Amy FX Pro Build and Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/assets/app-version.js'
      - 'app/src/main/assets/update-checker.js'
      - 'app/src/main/assets/apps/mapping/**'
      - 'supabase/functions/scalper-engine/**'
      - 'supabase/functions/smt-dxy-candles/**'
      - 'update.json'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amyfx-pro-release-${{ github.ref }}
  cancel-in-progress: true

env:
  AMYFX_APPLICATION_ID: com.amyelitesuite.learningpreview
  AMYFX_APP_LABEL: Amy FX Pro
  AMYFX_URI_SCHEME: amyfxpreview
  AMYFX_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/suhaimitoamy/Amy-fx-pro/main/update.json
  AMYFX_VERSION_NAME: "2.0.0-pro.321"
  AMYFX_VERSION_CODE: "950321"
  AMYFX_RELEASE_TAG: amyfx-pro-2.0.0-pro.321
  AMYFX_KEYSTORE_PATH: /tmp/amyfx-pro-signing.keystore
  AMYFX_KEYSTORE_PASSWORD: android
  AMYFX_KEY_PASSWORD: android
  TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Amy FX Pro
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Pro identity and Preview baseline
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app-version.js
          node --check app/src/main/assets/update-checker.js
          node --check app/src/main/assets/apps/mapping/js/scalper-stats-page.js
          node --check app/src/main/assets/apps/mapping/js/engine/sweep-acceptance.js
          node --check app/src/main/assets/apps/mapping/js/engine/smt-selector.js
          node --check app/src/main/assets/apps/mapping/js/engine/mapping-context-aggregator.js
          node --check app/src/main/assets/apps/mapping/js/mapping-context-orchestrator-v1.js
          node --check supabase/functions/scalper-engine/expansion-range-reentry.mjs
          node --check supabase/functions/scalper-engine/expansion-range-lifecycle.mjs
          node --check supabase/functions/scalper-engine/smr-first-retest.mjs
          grep -Fq "name: '2.0.0-pro.321', code: 950321" app/src/main/assets/app-version.js
          grep -Fq 'com.amyelitesuite.learningpreview' app/build.gradle.kts
          grep -Fq 'Amy FX Pro' app/build.gradle.kts
          grep -Fq 'Amy-fx-pro/main/update.json' app/build.gradle.kts
          grep -Fq 'Amy FX Pro' app/src/main/assets/index.html
          grep -Fq 'href="scalper-stats.html"' app/src/main/assets/apps/mapping/index.html
          grep -Fq 'Riwayat & Statistik' app/src/main/assets/apps/mapping/scalper-stats.html
          grep -Fq 'PERFORMA PER METODE' app/src/main/assets/apps/mapping/js/scalper-stats-page.js
          grep -Fq 'EXPANSION_RANGE_REENTRY' supabase/functions/scalper-engine/expansion-range-reentry.mjs
          grep -Fq 'SMR_FIRST_RETEST' supabase/functions/scalper-engine/smr-first-retest.mjs
          grep -Fq 'SMT_XAU_DXY' app/src/main/assets/apps/mapping/js/engine/mapping-context-aggregator.js
          grep -Fq 'SWEEP_REJECTION' app/src/main/assets/apps/mapping/js/engine/sweep-acceptance.js
          python3 -m json.tool update.json >/dev/null
          grep -Fq '"latest_version_code": 950321' update.json
          grep -Fq '"latest_version_name": "2.0.0-pro.321"' update.json
          grep -Fq 'amyfx-pro-2.0.0-pro.321/AmyFX-Pro-latest.apk' update.json

      - name: Run JavaScript regression suite
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Try Preview signing-key continuity
        id: preview-key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: amy-fx-debug-keystore-v1

      - name: Restore Amy FX Pro signing key
        id: pro-key
        if: steps.preview-key.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/amyfx-pro.keystore
          key: amy-fx-pro-signing-key-v1

      - name: Prepare persistent signing identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ "${{ steps.preview-key.outputs.cache-hit }}" = "true" ]; then
            cp "$HOME/.android/debug.keystore" "$AMYFX_KEYSTORE_PATH"
            echo 'AMYFX_KEY_ALIAS=androiddebugkey' >> "$GITHUB_ENV"
            echo 'mode=preview-continuity' >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.pro-key.outputs.cache-hit }}" != "true" ]; then
              keytool -genkeypair \
                -keystore "$HOME/.android/amyfx-pro.keystore" \
                -storepass "$AMYFX_KEYSTORE_PASSWORD" \
                -alias amyfxpro \
                -keypass "$AMYFX_KEY_PASSWORD" \
                -dname 'CN=Amy FX Pro, O=Amy FX, C=ID' \
                -keyalg RSA -keysize 2048 -validity 10000
              echo 'generated=true' >> "$GITHUB_OUTPUT"
            fi
            cp "$HOME/.android/amyfx-pro.keystore" "$AMYFX_KEYSTORE_PATH"
            echo 'AMYFX_KEY_ALIAS=amyfxpro' >> "$GITHUB_ENV"
            echo 'mode=pro-signer' >> "$GITHUB_OUTPUT"
          fi

      - name: Save new Amy FX Pro signing key
        if: steps.signing.outputs.generated == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/amyfx-pro.keystore
          key: amy-fx-pro-signing-key-v1

      - name: Verify signing identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(keytool -list -v -keystore "$AMYFX_KEYSTORE_PATH" -storepass "$AMYFX_KEYSTORE_PASSWORD" -alias "$AMYFX_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          test -n "$actual"
          echo "AMYFX_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"
          echo "Signing mode: ${{ steps.signing.outputs.mode }}"
          echo "Signing certificate SHA-256: $actual"
          if [ "${{ steps.signing.outputs.mode }}" = 'preview-continuity' ]; then
            test "$actual" = '47:C2:32:BC:44:FA:63:C9:2F:FE:41:1F:71:40:40:4C:09:AA:2A:9C:BF:82:B1:85:9A:86:0B:85:56:7B:AD:C7'
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Android tests and lint
        run: ./gradlew testReleaseUnitTest lintRelease --no-configuration-cache

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-configuration-cache --stacktrace

      - name: Verify APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$aapt" dump badging "$apk" | tee /tmp/amyfx-pro-badging.txt
          grep -Fq "package: name='${AMYFX_APPLICATION_ID}' versionCode='${AMYFX_VERSION_CODE}' versionName='${AMYFX_VERSION_NAME}'" /tmp/amyfx-pro-badging.txt
          grep -Fq "application-label:'${AMYFX_APP_LABEL}'" /tmp/amyfx-pro-badging.txt
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/amyfx-pro-signing.txt
          expected="$(echo "$AMYFX_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/amyfx-pro-signing.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          cp "$apk" AmyFX-Pro-latest.apk
          sha256sum AmyFX-Pro-latest.apk | tee AmyFX-Pro-latest.apk.sha256

      - name: Publish Amy FX Pro release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/amyfx-pro-release-notes.md <<NOTES
          Amy FX Pro $AMYFX_VERSION_NAME

          - Mapping Context Terpadu menjaga HTF, Swing/Internal Structure, Dealing Range, liquidity, Valid Break, BOS/CHoCH, Pattern, FVG/OB, reference levels, Final Bias dan Next Move tetap informatif saat Entry Map masih WAIT.
          - Market State, Market Outlook dan Entry Readiness dipisahkan: Outlook hanya skenario, sedangkan otoritas entry tetap Entry Map/setup resmi.
          - Sweep vs Acceptance ditambahkan sebagai context classifier tanpa membuka entry sendiri.
          - SMT XAUUSD-DXY M15 ditambahkan sebagai evidence-only selector dan tidak boleh mengubah atau memblokir engine lain.
          - Scalper Engine menambahkan SMR / First Retest M5: HTF-aligned liquidity sweep → displaced MSS → first FVG/OB retest.
          - Expansion Range Re-entry V3, driver Scalper lama, Vault/Riwayat, Mapping Amy-SMC-D dan closed-candle/no-future-data tetap dipertahankan.
          - Signing mode: ${{ steps.signing.outputs.mode }}.
          - Signing certificate SHA-256: $AMYFX_SIGNING_CERT_SHA256.
          NOTES
          if gh release view "$AMYFX_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$AMYFX_RELEASE_TAG" \
              AmyFX-Pro-latest.apk AmyFX-Pro-latest.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$AMYFX_RELEASE_TAG" \
              AmyFX-Pro-latest.apk AmyFX-Pro-latest.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Amy FX Pro $AMYFX_VERSION_NAME" \
              --notes-file /tmp/amyfx-pro-release-notes.md \
              --latest
          fi
          gh release view "$AMYFX_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'AmyFX-Pro-latest.apk'

      - name: Verify published APK endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${AMYFX_RELEASE_TAG}/AmyFX-Pro-latest.apk"
          curl -fL --retry 4 --retry-delay 3 -o /tmp/AmyFX-Pro-published.apk "$url"
          test -s /tmp/AmyFX-Pro-published.apk
          expected="$(sha256sum AmyFX-Pro-latest.apk | awk '{print $1}')"
          actual="$(sha256sum /tmp/AmyFX-Pro-published.apk | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Upload signed Pro artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amy-FX-Pro-${{ env.AMYFX_VERSION_NAME }}-signed
          path: |
            AmyFX-Pro-latest.apk
            AmyFX-Pro-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30